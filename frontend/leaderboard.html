<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="student-dashboard.html" id="nav-dashboard" data-testid="nav-dashboard">Dashboard</a></li>
        <li id="nav-history-item"><a href="history.html" data-testid="nav-history">History</a></li>
        <li><a href="leaderboard.html" aria-current="page" data-testid="nav-leaderboard">Leaderboard</a></li>
        <li><a href="profile.html" data-testid="nav-profile">Profile</a></li>
        <li><button type="button" id="logout-btn" data-testid="logout-btn">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <span class="eyebrow">Class rankings</span>
    <h1 style="font-size:clamp(1.7rem,4vw,2.6rem)">Leaderboard</h1>
    <p class="hint">Ranked by average score. Names marked "sample" are demo classmates.</p>

    <section aria-labelledby="podium-title">
      <h2 id="podium-title" class="sr-only">Top three students</h2>
      <ol class="podium" id="podium" data-testid="podium"></ol>
    </section>

    <section aria-labelledby="rest-title">
      <h2 id="rest-title">Everyone else</h2>
      <ol class="rank-list" id="rank-list" start="4" data-testid="rank-list"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere · Offline Demo Mode</div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/data.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
