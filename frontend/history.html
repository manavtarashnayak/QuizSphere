<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attempt history — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="student-dashboard.html">Dashboard</a></li>
        <li><a href="history.html" aria-current="page">History</a></li>
        <li><a href="leaderboard.html" data-testid="nav-leaderboard">Leaderboard</a></li>
        <li><a href="profile.html" data-testid="nav-profile">Profile</a></li>
        <li><button type="button" id="logout-btn" data-testid="logout-btn">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <span class="eyebrow">Student</span>
    <h1 style="font-size:clamp(1.7rem,4vw,2.6rem)">Attempt history</h1>

    <div class="topic-chips" role="group" aria-label="Filter by subject" id="filters">
      <button type="button" class="chip" data-topic="all" aria-pressed="true" data-testid="filter-all">All</button>
      <button type="button" class="chip" data-topic="math" aria-pressed="false" data-testid="filter-math"><span class="chip-dot" style="background:#fbbf24" aria-hidden="true"></span>Maths</button>
      <button type="button" class="chip" data-topic="gk" aria-pressed="false" data-testid="filter-gk"><span class="chip-dot" style="background:#34d399" aria-hidden="true"></span>General Knowledge</button>
      <button type="button" class="chip" data-topic="web" aria-pressed="false" data-testid="filter-web"><span class="chip-dot" style="background:#22d3ee" aria-hidden="true"></span>Web &amp; Code</button>
      <button type="button" class="chip" data-topic="mix" aria-pressed="false" data-testid="filter-mix"><span class="chip-dot" style="background:#93b4ff" aria-hidden="true"></span>Mixed</button>
    </div>

    <p class="hint" id="history-count" aria-live="polite" data-testid="history-count" style="margin-top:1.2rem"></p>
    <ul class="attempt-list" id="history-list" data-testid="history-list"></ul>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere · Offline Demo Mode</div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/data.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
