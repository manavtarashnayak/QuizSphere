<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" aria-current="page">Log in</a></li>
        <li><a href="register.html" data-testid="nav-register">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container auth-wrap">
    <section class="glass tilt auth-card" aria-labelledby="login-title">
      <span class="badge">Offline Demo Mode</span>
      <h1 id="login-title" style="margin-top:.8rem">Welcome back</h1>
      <p class="lead">Sign in to take or create quizzes.</p>

      <form id="login-form" novalidate>
        <fieldset>
          <legend>I am a</legend>
          <div class="role-toggle">
            <input type="radio" id="role-student" name="role" value="student" checked>
            <label for="role-student" data-testid="role-student">Student</label>
            <input type="radio" id="role-instructor" name="role" value="instructor">
            <label for="role-instructor" data-testid="role-instructor">Instructor</label>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@college.edu" required data-testid="login-email-input">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required data-testid="login-password-input">
        </div>

        <p id="form-error" class="form-error" role="alert" data-testid="login-error"></p>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem" data-testid="login-submit-btn">Sign in</button>
      </form>

      <p class="divider">Or fill in a demo account</p>
      <div class="demo-row">
        <button type="button" class="btn btn-ghost" id="demo-student" data-testid="demo-student-btn">Demo Student</button>
        <button type="button" class="btn btn-ghost" id="demo-instructor" data-testid="demo-instructor-btn">Demo Instructor</button>
      </div>
      <p class="divider">New here? <a href="register.html" data-testid="register-link">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere · Offline Demo Mode</div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
