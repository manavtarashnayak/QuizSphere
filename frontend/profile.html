<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your profile — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="student-dashboard.html" id="nav-dashboard" data-testid="nav-dashboard">Dashboard</a></li>
        <li><a href="profile.html" aria-current="page" data-testid="nav-profile">Profile</a></li>
        <li><button type="button" id="logout-btn" data-testid="logout-btn">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container auth-wrap">
    <section class="glass auth-card" aria-labelledby="profile-title">
      <div class="profile-head">
        <span class="profile-avatar" id="profile-avatar" aria-hidden="true" data-testid="profile-avatar"></span>
        <div>
          <h1 id="profile-title">Your profile</h1>
          <span class="badge" id="profile-role" data-testid="profile-role">Student</span>
        </div>
      </div>

      <dl class="profile-info">
        <dt>Email</dt>
        <dd id="profile-email" data-testid="profile-email"></dd>
      </dl>

      <form id="profile-form" novalidate>
        <div class="form-group">
          <label for="profile-name">Display name</label>
          <input type="text" id="profile-name" autocomplete="name" maxlength="60" required data-testid="profile-name-input">
        </div>
        <p id="form-error" class="form-error" role="alert" data-testid="profile-error"></p>
        <p id="form-success" class="form-success" role="status" data-testid="profile-success"></p>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem" data-testid="profile-save-btn">Save name</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere </div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
