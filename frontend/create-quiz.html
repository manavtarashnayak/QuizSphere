<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Assessment — Instructor Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

  <div class="app-layout">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="app-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <span>QuizAssess</span>
        </a>
        <button id="sidebar-close" class="sidebar-close-btn" aria-label="Close sidebar">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Instructor Portal</div>
        <a href="instructor-dashboard.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="create-quiz.html" class="sidebar-link active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span>Create Quiz</span>
        </a>
        <a href="quiz-list.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span>All Quizzes</span>
        </a>

        <div class="nav-section-title" style="margin-top: 1rem;">Platform</div>
        <a href="index.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          <span>Landing Page</span>
        </a>
        <a href="#" class="sidebar-link logout-trigger" style="color: var(--color-rose-400);">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Logout</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar" style="background: linear-gradient(135deg, var(--color-violet-600), var(--color-indigo-600));">PM</div>
          <div class="user-details">
            <div class="user-name">Prof. Sarah Miller</div>
            <span class="user-role-badge">Instructor</span>
          </div>
          <button class="logout-icon-btn logout-trigger" title="Sign Out">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Open menu">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h1 class="page-title">Create Assessment</h1>
        </div>
        <div class="topbar-right">
          <div id="api-status-badge"></div>
          <button type="button" id="preview-quiz-btn" class="btn btn-secondary btn-sm">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <span>Preview Quiz</span>
          </button>
          <button type="submit" form="create-quiz-form" id="save-quiz-btn" class="btn btn-primary btn-sm">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
            </svg>
            <span>Save & Publish</span>
          </button>
        </div>
      </header>

      <!-- Main Form -->
      <main class="dashboard-content">
        <form id="create-quiz-form" class="quiz-builder-container" novalidate>
          <!-- Section 1: Basic Information -->
          <div class="builder-section-card">
            <h2 class="builder-section-title">Assessment Metadata</h2>
            
            <div class="form-group">
              <label for="quiz-title" class="form-label">Quiz Title <span class="required">*</span></label>
              <input type="text" id="quiz-title" class="form-control" placeholder="e.g. Operating Systems & Process Scheduling" required>
            </div>

            <div class="form-group">
              <label for="quiz-desc" class="form-label">Description & Instructions</label>
              <textarea id="quiz-desc" class="form-control" rows="3" placeholder="Provide syllabus scope, prerequisites, or guidelines for the student..."></textarea>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
              <div class="form-group">
                <label for="quiz-category" class="form-label">Category / Course</label>
                <input type="text" id="quiz-category" class="form-control" placeholder="e.g. Computer Science" value="Computer Science">
              </div>

              <div class="form-group">
                <label for="quiz-difficulty" class="form-label">Difficulty Level</label>
                <select id="quiz-difficulty" class="form-control">
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate" selected>Intermediate</option>
                  <option value="Advanced">Advanced</option>
                </select>
              </div>

              <div class="form-group">
                <label for="quiz-duration" class="form-label">Duration (Minutes) <span class="required">*</span></label>
                <input type="number" id="quiz-duration" class="form-control" min="1" max="180" value="15" required>
              </div>

              <div class="form-group">
                <label for="quiz-pass-score" class="form-label">Passing Percentage (%)</label>
                <input type="number" id="quiz-pass-score" class="form-control" min="1" max="100" value="60">
              </div>
            </div>
          </div>

          <!-- Section 2: Questions Builder -->
          <div class="builder-section-card">
            <div class="builder-section-title">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span>Questions</span>
                <span id="total-q-badge" class="badge badge-indigo">1 Question</span>
              </div>
              <button type="button" id="add-question-btn" class="btn btn-secondary btn-sm">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                <span>Add Question</span>
              </button>
            </div>

            <!-- Dynamic Question Items List -->
            <div id="questions-list-container">
              <!-- Dynamically populated by create-quiz.js -->
            </div>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border-color);">
              <button type="button" onclick="document.getElementById('add-question-btn').click()" class="btn btn-outline btn-sm">
                + Add Another Question
              </button>
            </div>
          </div>

          <!-- Submit Bar -->
          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 3rem;">
            <a href="instructor-dashboard.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              Save & Publish Assessment
            </button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/create-quiz.js"></script>
</body>
</html>
