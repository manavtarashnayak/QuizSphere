<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Quizzes — Quiz Assessment Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span>QuizAssess</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="quiz-list.html" class="nav-link active">Available Quizzes</a></li>
        <li><a href="student-dashboard.html" class="nav-link">Dashboard</a></li>
      </ul>

      <div class="nav-actions" id="navbar-auth-actions">
        <div id="api-status-badge"></div>
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
        <button class="mobile-nav-toggle" id="mobile-toggle" aria-label="Toggle menu">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main style="padding: 3rem 0; flex: 1;">
    <div class="container">
      <!-- Catalog Header -->
      <div style="margin-bottom: 2rem;">
        <span class="badge badge-indigo" style="margin-bottom: 0.5rem;">Academic Catalog</span>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1>Available Assessments</h1>
            <p style="margin-top: 0.25rem;">Select an assessment to evaluate your knowledge and track your progress.</p>
          </div>
          <span id="catalog-results-count" class="badge badge-neutral" style="font-size: 0.8125rem;">Loading...</span>
        </div>
      </div>

      <!-- Search & Filter Controls -->
      <div class="filter-toolbar">
        <div class="search-box">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="catalog-search" class="form-control" placeholder="Search by topic, keyword, or title...">
        </div>

        <select id="catalog-category" class="form-control filter-select">
          <option value="">All Categories</option>
        </select>

        <select id="catalog-difficulty" class="form-control filter-select">
          <option value="">All Difficulties</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <!-- Quiz Grid -->
      <div id="quiz-catalog-grid" class="quiz-grid">
        <!-- Rendered dynamically by quiz-list.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <span>&copy; 2026 Quiz Assessment Platform. All rights reserved.</span>
        <span>Standard Academic Evaluation Suite.</span>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/quiz-list.js"></script>
</body>
</html>
