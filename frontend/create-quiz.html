<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Quiz — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="instructor-dashboard.html">Dashboard</a></li>
        <li><a href="create-quiz.html" aria-current="page">Create quiz</a></li>
        <li><a href="profile.html" data-testid="nav-profile">Profile</a></li>
        <li><button type="button" id="logout-btn" data-testid="logout-btn">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <span class="eyebrow">Instructor</span>
    <h1 style="font-size:clamp(1.7rem,4vw,2.6rem)">Create a new quiz</h1>

    <form id="quiz-form" class="builder" novalidate>
      <section class="glass builder-card" aria-labelledby="details-title">
        <h2 id="details-title">Quiz details</h2>
        <div class="form-group">
          <label for="quiz-title">Quiz title</label>
          <input type="text" id="quiz-title" required maxlength="80" placeholder="e.g. Science Basics" data-testid="quiz-title-input">
        </div>
        <div class="form-group">
          <label for="quiz-desc">Short description</label>
          <input type="text" id="quiz-desc" maxlength="140" placeholder="What is this quiz about?" data-testid="quiz-desc-input">
        </div>
        <div class="form-group">
          <label for="quiz-topic">Subject</label>
          <select id="quiz-topic" data-testid="quiz-topic-select">
            <option value="math">Maths</option>
            <option value="gk">General Knowledge</option>
            <option value="web">Web &amp; Code</option>
            <option value="mix" selected>Mixed</option>
          </select>
        </div>
        <div class="form-group">
          <label for="quiz-minutes">Time limit (minutes)</label>
          <input type="number" id="quiz-minutes" min="1" max="180" value="10" required data-testid="quiz-minutes-input">
        </div>
      </section>

      <div id="question-list" data-testid="question-list"></div>

      <p id="form-error" class="form-error" role="alert" data-testid="create-quiz-error"></p>

      <div class="builder-actions">
        <button type="button" class="btn btn-ghost" id="add-question" data-testid="add-question-btn">+ Add question</button>
        <button type="submit" class="btn btn-primary" data-testid="save-quiz-btn">Save quiz</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere </div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/create-quiz.js"></script>
</body>
</html>
