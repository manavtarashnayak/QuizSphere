<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — QuizSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-cube" aria-hidden="true"></span><span>QuizSphere</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Log in</a></li>
        <li><a href="register.html" aria-current="page">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container auth-wrap">
    <section class="glass auth-card" aria-labelledby="register-title">
      <span class="badge" id="connection-status-badge">● Checking connection...</span>
      <h1 id="register-title" style="margin-top:.8rem">Create your account</h1>
      <p class="lead">Your account is saved only in this browser.</p>

      <form id="register-form" novalidate>
        <fieldset>
          <legend>I am a</legend>
          <div class="role-toggle">
            <input type="radio" id="role-student" name="role" value="student" checked>
            <label for="role-student" data-testid="register-role-student">Student</label>
            <input type="radio" id="role-instructor" name="role" value="instructor">
            <label for="role-instructor" data-testid="register-role-instructor">Instructor</label>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" maxlength="60" placeholder="e.g. Sumedha Sil" required data-testid="register-name-input">
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@college.edu" required data-testid="register-email-input">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required aria-describedby="strength-text" data-testid="register-password-input">
          <div class="strength" id="strength" data-level="0" aria-hidden="true" data-testid="strength-meter">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="strength-text" id="strength-text" aria-live="polite" data-testid="strength-text">Use 8+ characters with a capital letter, a number and a symbol.</p>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" placeholder="Type it again" required data-testid="register-confirm-input">
        </div>

        <p id="form-error" class="form-error" role="alert" data-testid="register-error"></p>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem" data-testid="register-submit-btn">Create account</button>
      </form>
      <p class="divider">Already have an account? <a href="login.html" data-testid="login-link">Log in</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 QuizSphere </div>
  </footer>

  <script src="js/background.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
