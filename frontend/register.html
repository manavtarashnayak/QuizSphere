<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Quiz Assessment Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span>QuizAssess</span>
      </a>

      <div class="nav-actions">
        <div id="api-status-badge"></div>
        <span style="font-size: 0.875rem; color: var(--text-muted);">Already have an account?</span>
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Register Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join QuizAssess to take and manage academic quizzes</p>
      </div>

      <!-- Feedback Alert -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <form id="register-form" novalidate>
        <!-- Role Selection -->
        <div class="role-selector-wrap">
          <span class="role-selector-label">I want to join as</span>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" name="role" id="role-student" value="student" checked>
              <label for="role-student">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
                </svg>
                Student
              </label>
            </div>
            <div class="role-option">
              <input type="radio" name="role" id="role-instructor" value="instructor">
              <label for="role-instructor">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1"/>
                </svg>
                Instructor
              </label>
            </div>
          </div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label for="fullname" class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" id="fullname" class="form-control" placeholder="e.g. Alex Johnson" autocomplete="name" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="name@college.edu" autocomplete="email" required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <div class="password-input-group">
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" required>
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="strength-bars">
              <div id="bar-1" class="strength-bar"></div>
              <div id="bar-2" class="strength-bar"></div>
              <div id="bar-3" class="strength-bar"></div>
            </div>
            <div id="strength-label" class="strength-text">Password strength</div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm Password <span class="required">*</span></label>
          <div class="password-input-group">
            <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your password" autocomplete="new-password" required>
            <button type="button" class="password-toggle-btn" data-target="confirm-password" aria-label="Show password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Create Account
        </button>

        <div class="auth-footer">
          Already registered? <a href="login.html">Sign in to your account</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
